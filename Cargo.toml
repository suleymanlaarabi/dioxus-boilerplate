[package]
name = "boilerplate"
version = "0.1.0"
authors = ["suleyman"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = ["router", "fullstack"] }
dioxus-icons = { version = "0.1.0", default-features = false }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
argon2 = { version = "0.6", features = ["getrandom"], optional = true }
dotenvy = { version = "0.15", optional = true }
getrandom = { version = "0.4", optional = true }
hex = { version = "0.4", optional = true }
sha2 = { version = "0.11", optional = true }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "dep:argon2", "dep:dotenvy", "dep:getrandom", "dep:hex", "dep:sha2", "dep:sqlx", "dep:tokio"]
